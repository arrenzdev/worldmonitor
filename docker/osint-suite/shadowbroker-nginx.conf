# Local-only integration bridge. Shadowbroker intentionally denies framing in
# its standalone deployment. This bridge replaces those two framing headers
# only at the loopback-bound WorldMonitor integration port; all other CSP
# restrictions are retained as a static production policy.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream shadowbroker_frontend {
    server shadowbroker-frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://shadowbroker_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;

      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Content-Security-Policy-Report-Only;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https:; font-src 'self' data:; object-src 'none'; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://video.ibm.com https://ustream.tv https://www.ustream.tv https://t.me; media-src 'self' blob:; frame-ancestors http://localhost:* http://127.0.0.1:*; base-uri 'self'; form-action 'self'" always;
    }
  }
}
