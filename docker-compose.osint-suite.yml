# Optional local OSINT Suite. This file only adds services; the default
# docker-compose.yml remains unchanged.
#
# Start:
#   docker compose -f docker-compose.yml -f docker-compose.osint-suite.yml up -d --build
#
# Every browser-facing integration is bound to loopback. Do not widen these
# bindings without adding authentication and reviewing each upstream project.

services:
  velocity-api:
    image: ghcr.io/andrewctf/velocity-api:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      CORS_ORIGINS: "http://127.0.0.1:3101,http://localhost:3101"
      ARCHIVE_MODE: "1"
      HISTORY_DISK_BUDGET_GB: "${VELOCITY_HISTORY_DISK_BUDGET_GB:-5}"
      ALLOW_UNAUTHENTICATED: "1"
      OPENSKY_CLIENT_ID: "${OPENSKY_CLIENT_ID:-}"
      OPENSKY_CLIENT_SECRET: "${OPENSKY_CLIENT_SECRET:-}"
      AISSTREAM_KEY: "${AISSTREAM_API_KEY:-}"
      FIRMS_MAP_KEY: "${NASA_FIRMS_API_KEY:-}"
      GFW_TOKEN: "${GFW_API_TOKEN:-}"
      ACLED_KEY: "${ACLED_ACCESS_TOKEN:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      CLOUDFLARE_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CDSE_CLIENT_ID: "${CDSE_CLIENT_ID:-}"
      CDSE_CLIENT_SECRET: "${CDSE_CLIENT_SECRET:-}"
      GMAPS_KEY: "${GMAPS_KEY:-}"
      OPENAIP_KEY: "${OPENAIP_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
    volumes:
      - velocity-data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  velocity-web-build:
    image: ghcr.io/andrewctf/velocity-web:latest
    command: ["pnpm", "--filter", "@osint/web", "build"]
    volumes:
      - velocity-web-dist:/srv/apps/web/dist
    restart: "no"

  velocity:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3101:80"
    volumes:
      - ./docker/osint-suite/velocity-nginx.conf:/etc/nginx/nginx.conf:ro
      - velocity-web-dist:/usr/share/nginx/html:ro
    depends_on:
      velocity-api:
        condition: service_healthy
      velocity-web-build:
        condition: service_completed_successfully
    restart: unless-stopped

  ironsight:
    image: worldmonitor-ironsight:2e7005c
    build:
      context: https://github.com/NoblerWorks-HQ/IRONSIGHT.git#2e7005cf7eef191cbad55bc5fca09c19e77d7b84
    ports:
      - "127.0.0.1:3102:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s

  shadowbroker-backend:
    image: ghcr.io/bigbodycobain/shadowbroker-backend:latest
    environment:
      AIS_API_KEY: "${AIS_API_KEY:-}"
      OPENSKY_CLIENT_ID: "${OPENSKY_CLIENT_ID:-}"
      OPENSKY_CLIENT_SECRET: "${OPENSKY_CLIENT_SECRET:-}"
      LTA_ACCOUNT_KEY: "${LTA_ACCOUNT_KEY:-}"
      GFW_API_TOKEN: "${GFW_API_TOKEN:-}"
      WINDY_API_KEY: "${WINDY_API_KEY:-}"
      ADMIN_KEY: "${SHADOWBROKER_ADMIN_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      AIRFRAMES_API_KEY: "${AIRFRAMES_API_KEY:-}"
      PREDICTION_MARKETS_ENABLED: "${PREDICTION_MARKETS_ENABLED:-false}"
      FINANCIAL_ENABLED: "${FINANCIAL_ENABLED:-false}"
      CROWDTHREAT_ENABLED: "${CROWDTHREAT_ENABLED:-false}"
      FIMI_ENABLED: "${FIMI_ENABLED:-false}"
      NUFORC_ENABLED: "${NUFORC_ENABLED:-false}"
      NEWS_ENABLED: "${NEWS_ENABLED:-true}"
      XQUIK_ENABLED: "${XQUIK_ENABLED:-false}"
      XQUIK_API_KEY: "${XQUIK_API_KEY:-}"
      TELEGRAM_OSINT_ENABLED: "${TELEGRAM_OSINT_ENABLED:-true}"
      TELEGRAM_OSINT_CHANNELS: "${TELEGRAM_OSINT_CHANNELS:-}"
      TELEGRAM_OSINT_TRANSLATE: "${TELEGRAM_OSINT_TRANSLATE:-true}"
      SHADOWBROKER_TRUST_DOCKER_BRIDGE_LOCAL_OPERATOR: "1"
      SHADOWBROKER_TRUSTED_FRONTEND_HOSTS: "shadowbroker-frontend"
      MESH_INFONET_FLEET_JOIN: "${MESH_INFONET_FLEET_JOIN:-true}"
      MESH_INFONET_ALLOW_CLEARNET_SYNC: "${MESH_INFONET_ALLOW_CLEARNET_SYNC:-false}"
      MESH_ARTI_ENABLED: "${MESH_ARTI_ENABLED:-false}"
      MESH_PEER_PUSH_SECRET: "${MESH_PEER_PUSH_SECRET:-}"
      MESH_MQTT_ENABLED: "${MESH_MQTT_ENABLED:-false}"
      OPENCLAW_HMAC_SECRET: "${OPENCLAW_HMAC_SECRET:-}"
    volumes:
      - shadowbroker-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  shadowbroker-frontend:
    image: ghcr.io/bigbodycobain/shadowbroker-frontend:latest
    environment:
      BACKEND_URL: "http://shadowbroker-backend:8000"
      ADMIN_KEY: "${SHADOWBROKER_ADMIN_KEY:-}"
    depends_on:
      shadowbroker-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  shadowbroker:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3103:80"
    volumes:
      - ./docker/osint-suite/shadowbroker-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      shadowbroker-frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  velocity-data: {}
  velocity-web-dist: {}
  shadowbroker-data: {}
